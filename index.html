<title>WSU WOWY 26-27</title>
<style>:root{--crimson:#981E32;--crimson-d:#7a1727;--gray:#5E6A71;--bg:#f3f4f6;--card:#fff;--line:#e3e6ea;--ink:#1f2933;--muted:#667085;--good:#0b7a3b;--bad:#b42318;--warn:#b45309;--info:#475467}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
[hidden]{display:none!important}
button,select,input,textarea{font:inherit;color:inherit}
.top{background:var(--crimson);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font-size:19px;font-weight:800;letter-spacing:.2px}.brand span{font-weight:500;opacity:.85;margin-left:6px}
#status{font-size:12.5px;opacity:.9}
.tabs{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs button{flex:0 0 auto;background:none;border:0;border-bottom:3px solid transparent;padding:13px 16px;font-size:15px;color:var(--gray);cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--crimson);font-weight:700;border-bottom-color:var(--crimson)}
main{max-width:1100px;margin:0 auto;padding:12px 12px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
h2{font-size:17px;margin:0 0 4px}h3{font-size:15px;margin:14px 0 6px}
.hint,.muted{color:var(--muted);font-size:14px}.hint{margin:0 0 10px}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
label.f{display:block;font-size:12.5px;color:var(--muted)}
select,input[type=text],input[type=password],input[type=number],textarea{width:100%;font-size:16px;padding:10px;border:1px solid #cfd4da;border-radius:8px;background:#fff}
select{margin-top:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
button.b{padding:10px 14px;border-radius:8px;border:1px solid #cfd4da;background:#fff;cursor:pointer;font-size:15px}
button.b.p{background:var(--crimson);border-color:var(--crimson);color:#fff;font-weight:600}
button.b:active{transform:translateY(1px)}
button.b[disabled]{opacity:.5}
.check{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:15px}.check input{margin-top:4px;width:18px;height:18px}
details>summary{cursor:pointer;color:var(--crimson);font-weight:600;margin:8px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{border:1px solid #cfd4da;background:#fff;border-radius:999px;padding:7px 12px;font-size:13.5px;cursor:pointer}
.chip small{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
@media(min-width:720px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .big{font-size:24px;font-weight:800;line-height:1.1}.stat .lab{font-size:12px;color:var(--muted);margin-top:3px}
.good{color:var(--good)}.bad{color:var(--bad)}
.tablewrap{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:10px;background:#fff}
table.data{border-collapse:separate;border-spacing:0;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
table.data th,table.data td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid #eef0f2}
table.data th{position:sticky;top:0;background:#f8f9fa;z-index:2;font-size:12.5px;color:#475467;cursor:pointer;user-select:none}
table.data th:first-child,table.data td:first-child{text-align:left;position:sticky;left:0;background:#fff;z-index:1;border-right:1px solid #eef0f2}
table.data th:first-child{z-index:3;background:#f8f9fa}
table.data tr.dim td{opacity:.42}
table.data td.n{background-clip:padding-box}
table.mini{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums}
table.mini th{font-size:12px;color:var(--muted);font-weight:600;text-align:right;padding:4px 8px;border-bottom:1px solid var(--line)}
table.mini th:first-child,table.mini td:first-child{text-align:left}
table.mini td{padding:7px 8px;text-align:right;border-bottom:1px solid #f0f2f4}
.sub{font-size:12px;color:var(--muted)}
.player{border:1px solid var(--line);border-radius:10px;padding:2px 10px 8px;margin:8px 0}
.player summary{margin:6px 0}
.issue{border:1px solid var(--line);border-left:5px solid var(--info);border-radius:10px;padding:10px 12px;margin:8px 0;background:#fff}
.issue.error{border-left-color:var(--bad)}.issue.warn{border-left-color:var(--warn)}
.issue h4{margin:0 0 3px;font-size:15px}.issue p{margin:2px 0 8px;font-size:14px;color:#344054}
.issue .row{margin-top:6px}.issue select{width:auto;max-width:100%;min-width:200px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;margin-right:6px;color:#fff;background:var(--info)}
.pill.error{background:var(--bad)}.pill.warn{background:var(--warn)}.pill.ok{background:var(--good)}
.banner{background:#fff4e5;border:1px solid #f5c26b;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14.5px}
.lock{max-width:420px;margin:12vh auto;padding:0 16px}.lock .card{padding:20px}
.err{color:var(--bad);font-size:14px;margin-top:8px}
ol.steps{padding-left:20px;margin:6px 0}ol.steps li{margin:4px 0}
code{background:#f1f3f5;padding:1px 5px;border-radius:5px;font-size:13px}
footer{max-width:1100px;margin:0 auto;padding:0 14px 30px;color:var(--muted);font-size:12.5px}
.legend span{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin:0 3px 0 8px;border:1px solid #d0d5dd}

@media(max-width:440px){.pickgrid{grid-template-columns:1fr}}
main.wide{max-width:1800px}

/* Lineup site only (not in the practice-stats build). Players tab: every column fits the screen at normal page zoom.
   Compact spacing lives here; the type size itself is chosen per screen by fitPlayers() in app.mjs (largest size at which the whole row fits). */
.tablewrap.fit{max-height:none}
table.data.fit{font-size:13px}
table.data.fit th,table.data.fit td{padding:.5em .38em}
table.data.fit th{font-size:.92em;line-height:1.15;vertical-align:bottom}
table.data.fit th.w{white-space:normal}
table.data.fit th:first-child,table.data.fit td:first-child{padding-left:.7em;padding-right:.7em}
table.data.fit.nopct .u{display:none}
.npnote{display:none;font-style:normal}
.card.np .npnote{display:inline}
</style>
</head>
